# Désactivé : les jeux d'arcade ne sont plus affichés dans le README.
# Exécution manuelle uniquement (Actions > Run workflow) si besoin de les régénérer.
name: Generate Arcade Games
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper"
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-arcade
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
