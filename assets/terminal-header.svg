<svg viewBox="0 0 820 470" width="820" height="470" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
  </defs>

  <!-- fenêtre -->
  <rect x="8" y="8" width="804" height="454" rx="14" fill="url(#glow)" stroke="#292e42" stroke-width="1.5"/>
  <!-- barre de titre -->
  <rect x="8" y="8" width="804" height="46" rx="14" fill="#1f2335"/>
  <rect x="8" y="40" width="804" height="14" fill="#1f2335"/>
  <circle cx="34" cy="31" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="31" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="31" r="7" fill="#27c93f"/>
  <text x="410" y="36" text-anchor="middle" fill="#565f89" font-size="16">aymerick@soc : ~</text>

  <!-- corps -->
  <g font-size="21">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.25s" fill="freeze"/>
      <text x="34" y="104"><tspan fill="#9ece6a">$</tspan> <tspan fill="#c0caf5">whoami</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.25s" fill="freeze"/>
      <text x="34" y="140" fill="#7dcfff" font-size="24" font-weight="700">Aymerick Victoire</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.25s" fill="freeze"/>
      <text x="34" y="188"><tspan fill="#9ece6a">$</tspan> <tspan fill="#c0caf5">role --current</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.25s" fill="freeze"/>
      <text x="34" y="222" fill="#bb9af7">Sysadmin &amp; Réseau  →  Security Engineer</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.25s" fill="freeze"/>
      <text x="34" y="270"><tspan fill="#9ece6a">$</tspan> <tspan fill="#c0caf5">cat stack.txt</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.25s" fill="freeze"/>
      <text x="34" y="304" fill="#e0af68">Azure Security · Sentinel · KQL · Terraform · Ansible</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.25s" fill="freeze"/>
      <text x="34" y="352"><tspan fill="#9ece6a">$</tspan> <tspan fill="#c0caf5">whereami</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.25s" fill="freeze"/>
      <text x="34" y="386" fill="#9ece6a">Montréal — bientôt</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.7s" dur="0.2s" fill="freeze"/>
      <text x="34" y="430"><tspan fill="#9ece6a">$</tspan></text>
    </g>
    <rect x="52" y="413" width="13" height="22" fill="#7dcfff" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="4.9s" dur="0.1s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="5.0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
