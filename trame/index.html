<title>Trame</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
/* Layout: an analyst's workbench. Conversations rail | network map over a time trace | inspector.
   Panels are split by hairlines, not cards. Protocol colours follow the T568B cable pairs. */
:root{
  --bg:#E6E9ED; --panel:#F6F7F9; --sunk:#DCE1E7; --hover:#ECEFF2;
  --ink:#111920; --ink2:#43505C; --ink3:#76818D; --rule:#C8CFD7; --zone:#EEF1F4;
  --p-tls:#1E5DA6; --p-dns:#2A7746; --p-smb:#7A4C2B; --p-tcp:#CC5B0B; --p-arp:#89929C;
  --crit:#B42318; --crit-bg:#F7E1DD; --warn:#94590A; --warn-bg:#F3E7D2;
  --m-ink:var(--ink); --m-crit:var(--crit); --m-warn:var(--warn); --m-mut:var(--ink3);
  --f-ui:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --panel:#151B20; --sunk:#202931; --hover:#1A2128;
  --ink:#E4E8EB; --ink2:#AAB4BD; --ink3:#77838E; --rule:#2A343D; --zone:#121820;
  --p-tls:#6EA2E4; --p-dns:#5FBC83; --p-smb:#C38E66; --p-tcp:#EF8A3F; --p-arp:#8C97A2;
  --crit:#F0766B; --crit-bg:#3A1C1A; --warn:#E0A94A; --warn-bg:#33281A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1317; --panel:#151B20; --sunk:#202931; --hover:#1A2128;
  --ink:#E4E8EB; --ink2:#AAB4BD; --ink3:#77838E; --rule:#2A343D; --zone:#121820;
  --p-tls:#6EA2E4; --p-dns:#5FBC83; --p-smb:#C38E66; --p-tcp:#EF8A3F; --p-arp:#8C97A2;
  --crit:#F0766B; --crit-bg:#3A1C1A; --warn:#E0A94A; --warn-bg:#33281A;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.ev:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:21px;font-weight:700;font-stretch:78%;letter-spacing:-.01em}
.file{display:flex;flex-direction:column;gap:1px;min-width:0}
.file .name{font-family:var(--f-mono);font-size:12.5px}
.file .meta{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;font-stretch:85%;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);border:1px solid var(--rule);padding:1px 6px;border-radius:2px;white-space:nowrap}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--bg);border-radius:3px;padding:0 10px;height:32px;min-width:0;flex:0 1 320px}
.search input{border:0;background:none;outline:none;font:inherit;font-size:13px;color:var(--ink);width:100%;min-width:0}
.search input::placeholder{color:var(--ink3)}
.mode{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden;flex:none}
.mode button{padding:5px 12px;font-size:13px;font-weight:500}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* ---------- workbench ---------- */
.work{display:grid;grid-template-columns:290px minmax(0,1fr) minmax(360px,410px);min-height:0}
.rail,.insp{background:var(--panel);overflow:auto;min-height:0}
.rail{border-right:1px solid var(--rule)}
.insp{border-left:1px solid var(--rule)}
.center{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}

.sec{padding:14px 16px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:11px;font-weight:600;font-stretch:85%;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3)}
.h .n{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:400}

/* findings */
.find{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 8px;width:100%;text-align:left;padding:7px 8px;margin:0 -8px;border-radius:3px;width:calc(100% + 16px)}
.find:hover{background:var(--hover)}
.find .g{grid-row:span 2;padding-top:3px}
.find .t{font-weight:600;font-size:13.5px}
.find .s{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.find[aria-current="true"]{background:var(--sunk)}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;padding:3px 9px;border:1px solid var(--rule);border-radius:2px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--bg)}

/* conversation rows */
.conv{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:calc(100% + 16px);margin:0 -8px;padding:8px;border-radius:3px;text-align:left}
.conv:hover{background:var(--hover)}
.conv[aria-current="true"]{background:var(--sunk)}
.conv .main{min-width:0;display:flex;flex-direction:column}
.conv .t,.conv .s{display:block}
.conv .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .s{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.conv .b{font-family:var(--f-mono);font-size:11.5px;color:var(--ink2)}
.conv .glyph{display:inline-block;vertical-align:-1px;margin-right:4px}
.spark{display:block}
.empty{font-size:13px;color:var(--ink3);padding:6px 0}

/* cable swatch */
.wire{display:block;width:18px;height:6px;border-radius:3px;background:var(--c)}
.wire.striped{background:repeating-linear-gradient(90deg,var(--c) 0 4px,var(--panel) 4px 7px);box-shadow:inset 0 0 0 1px var(--c)}

/* ---------- map ---------- */
.map{position:relative;min-height:0;display:flex;flex-direction:column}
.map svg{flex:1;width:100%;min-height:260px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 16px 10px;font-size:12px;color:var(--ink2);border-top:1px solid var(--rule);background:var(--bg)}
.legend span{display:flex;align-items:center;gap:6px}
.legend em{font-style:normal;color:var(--ink3)}
.zone{fill:var(--zone);stroke:var(--rule)}
.zlabel{font:600 11px var(--f-ui);font-stretch:85%;letter-spacing:.09em;fill:var(--ink3)}
.zsub{font:400 11px var(--f-mono);fill:var(--ink3)}
.edge{fill:none;stroke-linecap:round;transition:opacity .25s,stroke-width .2s}
.edge.dim{opacity:.32}
.edge.idle{opacity:.12}
.edge.off{opacity:.06}
.halo{fill:none;stroke:var(--ink);stroke-linecap:round;opacity:0;transition:opacity .2s}
.halo.on{opacity:.18}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.node circle,.node rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.node.me circle.core{fill:var(--ink)}
.node{cursor:pointer}
.node:hover circle,.node:hover rect{stroke-width:2.5}
.nl{font:600 12.5px var(--f-ui);fill:var(--ink)}
.ns{font:400 10.5px var(--f-mono);fill:var(--ink3)}
.dot{pointer-events:none}

/* ---------- trace ---------- */
.trace{background:var(--panel);border-top:1px solid var(--rule);padding:10px 16px 12px}
.trace-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.trace-h .h{margin:0}
.play{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--ink);border-radius:50%}
.play svg{fill:var(--ink)}
.clock{font-family:var(--f-mono);font-size:12.5px;min-width:9ch}
.reset{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.plot{position:relative;height:92px;touch-action:none;cursor:crosshair;user-select:none}
.plot svg.bars{position:absolute;inset:0 0 18px 0;width:100%;height:calc(100% - 18px)}
.axis{position:absolute;left:0;right:0;bottom:0;height:16px;border-top:1px solid var(--rule)}
.axis span{position:absolute;top:2px;transform:translateX(-50%);font:400 10.5px var(--f-mono);color:var(--ink3)}
.axis span{white-space:nowrap}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.mk{position:absolute;top:-2px;transform:translateX(-50%);width:16px;height:14px;display:flex;align-items:center;justify-content:center}
.head{position:absolute;top:-4px;bottom:16px;width:0;border-left:1.5px solid var(--ink);pointer-events:none}
.head::before{content:"";position:absolute;top:-3px;left:-5.5px;width:9px;height:9px;background:var(--ink);transform:rotate(45deg)}
.loss-band{position:absolute;top:0;bottom:18px;background:var(--warn-bg);opacity:.75;pointer-events:none}

/* ---------- inspector ---------- */
.ih{padding:16px;border-bottom:1px solid var(--rule)}
.ih .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ih h2{font-size:21px;line-height:1.2;font-weight:650;font-stretch:88%;margin:0 0 4px;text-wrap:balance;letter-spacing:-.005em}
.ih .ends{font-family:var(--f-mono);font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 6px;border-radius:2px}
.pill.ok{color:var(--ink2);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.crit{color:var(--crit);background:var(--crit-bg)}
.proto{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.stats div{padding:10px 16px 12px;border-right:1px solid var(--rule)}
.stats div:last-child{border-right:0}
.stats dt{font-size:11px;color:var(--ink3);font-stretch:88%;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.stats dd{margin:2px 0 0;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.prose{margin:0;font-size:14px;line-height:1.55;color:var(--ink);max-width:62ch}
.todo{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.todo li{display:grid;grid-template-columns:18px minmax(0,1fr);font-size:13.5px;color:var(--ink2)}
.todo li::before{content:"→";color:var(--ink3);font-family:var(--f-mono)}
.subh{font-size:12px;font-weight:600;color:var(--ink);margin:14px 0 0}

.seqwrap{overflow-x:auto}
svg.seq{display:block;width:100%;min-width:330px}
.lane-h{font:600 12px var(--f-ui);fill:var(--ink)}
.lane-s{font:400 10.5px var(--f-mono);fill:var(--ink3)}
.lane{stroke:var(--rule);stroke-width:1}
.ev{cursor:pointer;outline:none}
.ev .bg{fill:transparent}
.ev:hover .bg{fill:var(--hover)}
.ev.on .bg{fill:var(--sunk)}
.ev .dt{font:400 10.5px var(--f-mono);fill:var(--ink3)}
.ev .lb{font:500 12px var(--f-ui);fill:var(--ink)}
.ev .lb.m{font:400 11.5px var(--f-mono)}
.ev .tt{font:400 10px var(--f-mono);fill:var(--ink3)}
.ev .gap{font:400 11.5px var(--f-ui);fill:var(--ink3)}

.layers{display:flex;flex-wrap:wrap;gap:0;margin:12px 0 0;font-size:12px}
.layers span{display:flex;flex-direction:column;padding:5px 9px;border:1px solid var(--rule);margin:0 -1px -1px 0;background:var(--bg)}
.layers span b{font-weight:600;font-size:12px}
.layers span i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--ink3)}
.layers span.top{background:var(--panel);border-color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.facts span{font-size:12.5px;padding:3px 8px;background:var(--bg);border:1px solid var(--rule);border-radius:2px}
.facts span em{font-style:normal;color:var(--ink3)}

.bitbox{overflow-x:auto;margin-top:12px}
.ruler,.bits{display:grid;grid-template-columns:repeat(32,minmax(10px,1fr));min-width:340px}
.ruler span{font:400 9.5px var(--f-mono);color:var(--ink3);height:14px;border-left:1px solid transparent}
.ruler span.k{border-left-color:var(--rule)}
.bits{border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.bits div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:3px 4px 4px;min-width:0;display:flex;flex-direction:column;justify-content:center;background:var(--panel)}
.bits div small{font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-stretch:85%}
.bits div span{font:500 11.5px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bits div.flag{padding:3px 0;align-items:center}
.bits div.flag small{font-family:var(--f-mono);font-stretch:100%}
.bits div.flag.on{background:var(--ink)}
.bits div.flag.on small,.bits div.flag.on span{color:var(--panel)}
.bitnote{font-size:11.5px;color:var(--ink3);margin-top:6px}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0 0;font-size:13px}
dl.kv dt{color:var(--ink3)}
dl.kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .work{grid-template-columns:270px minmax(0,1fr)}
  .insp{grid-column:1 / -1;border-left:0;border-top:1px solid var(--rule);overflow:visible}
  .app{height:auto}
  .rail{overflow:visible}
  .map svg{min-height:380px}
}
@media (max-width:760px){
  .work{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .map svg{min-height:0;aspect-ratio:800/440;flex:none}
  .ns{display:none}
  .nl{font-size:17px}
  .zlabel{font-size:16px}.zsub{display:none}
  .search{order:5;flex:1 1 100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats div:nth-child(2){border-right:0}
  .stats div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){.edge,.halo{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true">
        <rect x="0" y="3" width="7" height="8" style="fill:var(--ink3)"/>
        <rect x="8" y="3" width="5" height="8" style="fill:var(--ink)"/>
        <rect x="14" y="3" width="5" height="8" style="fill:var(--ink)"/>
        <rect x="20" y="3" width="2" height="8" style="fill:var(--ink2)"/>
        <rect x="23" y="1" width="8" height="12" style="fill:none;stroke:var(--ink);stroke-width:1.3"/>
        <rect x="32" y="3" width="2" height="8" style="fill:var(--ink3)"/>
      </svg>
      <b>trame</b>
    </div>
    <div class="file">
      <span class="name">bureau-lundi.pcapng</span>
      <span class="meta" id="meta"></span>
    </div>
    <span class="tag">Capture d'exemple</span>
    <div class="spacer"></div>
    <label class="search" for="q">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" style="fill:none;stroke:var(--ink3);stroke-width:1.5"/><path d="M9.5 9.5 13 13" style="stroke:var(--ink3);stroke-width:1.5"/></svg>
      <input id="q" type="search" placeholder="Chercher un appareil, un site, « lent »…" autocomplete="off">
    </label>
    <div class="mode" role="group" aria-label="Niveau de lecture">
      <button id="m-b" aria-pressed="true">Débutant</button>
      <button id="m-e" aria-pressed="false">Expert</button>
    </div>
  </header>

  <div class="work">
    <aside class="rail">
      <section class="sec">
        <h3 class="h"><span id="find-h">À regarder</span><span class="n" id="find-n"></span></h3>
        <div id="finds"></div>
      </section>
      <section class="sec">
        <h3 class="h"><span>Conversations</span><span class="n" id="conv-n"></span></h3>
        <div class="chips" role="group" aria-label="Filtre rapide">
          <button class="chip" data-chip="all" aria-pressed="true">Tout</button>
          <button class="chip" data-chip="pb" aria-pressed="false">Problèmes</button>
          <button class="chip" data-chip="enc" aria-pressed="false">Chiffré</button>
          <button class="chip" data-chip="lan" aria-pressed="false">Réseau local</button>
        </div>
        <div id="convs"></div>
      </section>
    </aside>

    <main class="center">
      <div class="map">
        <svg id="graph" viewBox="0 0 800 440" preserveAspectRatio="xMidYMid meet" aria-label="Carte des échanges"></svg>
        <div class="legend" id="legend"></div>
      </div>
      <section class="trace">
        <div class="trace-h">
          <button class="play" id="play" aria-label="Rejouer la capture">
            <svg width="10" height="12" viewBox="0 0 10 12" id="play-ic"><path d="M1 0.5 9.5 6 1 11.5z"/></svg>
          </button>
          <span class="clock" id="clock">0,000 s</span>
          <h3 class="h" id="trace-h">Activité · paquets par 100 ms</h3>
          <div class="spacer"></div>
          <button class="reset" id="reset" hidden>Voir toute la capture</button>
        </div>
        <div class="plot" id="plot">
          <div id="bands"></div>
          <svg class="bars" id="bars" viewBox="0 0 142 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="marks"></div>
          <div class="head" id="head" hidden></div>
          <div class="axis" id="axis"></div>
        </div>
      </section>
    </main>

    <aside class="insp" id="insp" aria-live="polite"></aside>
  </div>
</div>

<script>
(() => {
const DUR = 14.2, NB = 142;
const $ = s => document.querySelector(s);
const nf = (n, d=0) => n.toLocaleString('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtInt = n => nf(Math.round(n));
const fmtBytes = b => b < 1000 ? b + ' o' : b < 1e6 ? nf(b/1000, b<1e4?1:0) + ' Ko' : nf(b/1e6, 1) + ' Mo';
const fmtT = s => nf(s, 3) + ' s';
const fmtDelta = s => s < 0.0005 ? '+0' : s < 1 ? '+' + nf(s*1000, s < 0.1 ? 1 : 0) + ' ms' : '+' + nf(s, 2) + ' s';
const fmtDur = s => s < 1 ? nf(s*1000, 0) + ' ms' : nf(s, 1) + ' s';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- sample capture ---------- */
const HOSTS = {
  poste:{label:'Ce poste', ip:'192.168.1.24', x:165, y:220, zone:'lan'},
  nas:  {label:'NAS', ip:'192.168.1.40', x:80, y:105, zone:'lan'},
  imp:  {label:'Imprimante', ip:'192.168.1.52', x:85, y:345, zone:'lan'},
  box:  {label:'Box internet', ip:'192.168.1.1', x:392, y:220, zone:'gw'},
  dns:  {label:'Résolveur DNS', ip:'1.1.1.1', x:585, y:62, zone:'net'},
  gh:   {label:'api.github.com', ip:'140.82.121.6', x:615, y:142, zone:'net'},
  cdn:  {label:'video.cdn-exemple.net', ip:'198.51.100.80', x:615, y:226, zone:'net'},
  old:  {label:'portail.exemple.org', ip:'198.51.100.23', x:595, y:312, zone:'net'},
  dev:  {label:'203.0.113.50', ip:'port 8080', x:550, y:390, zone:'net'},
};
const PROTO = {
  TLS:{c:'--p-tls', name:'TLS', b:'Chiffré (TLS)'},
  QUIC:{c:'--p-tls', s:1, name:'QUIC', b:'Chiffré (QUIC)'},
  DNS:{c:'--p-dns', name:'DNS', b:'Annuaire (DNS)'},
  SMB:{c:'--p-smb', name:'SMB2', b:'Partage de fichiers'},

  let r = '';
  for (let i = 0; i < 32; i++) r += `<span class="${i % 8 === 0 ? 'k' : ''}">${i % 8 === 0 || i === 31 ? i : ''}</span>`;
  let g = cell('Port source', h.sp, 16) + cell('Port destination', h.dp, 16) +
    cell('Numéro de séquence (relatif)', fmtInt(h.seq), 32) + cell('Numéro d’acquittement (relatif)', fmtInt(h.ack), 32) +
    cell('Offset', off, 4) + cell('Rés.', 0, 4) +
    FL.map(f => `<div class="flag${h.f.includes(f) ? ' on' : ''}" title="${f}"><small>${f[0]}</small><span>${h.f.includes(f) ? 1 : 0}</span></div>`).join('') +
    cell('Fenêtre', fmtInt(h.win), 16) + cell('Somme de contrôle', '0x' + h.ck, 16) + cell('Pointeur urgent', 0, 16);
  if (h.opt) g += cell('Options (12 octets)', esc(h.opt), 32);
  return `<div class="bitbox"><div class="ruler" aria-hidden="true">${r}</div><div class="bits">${g}</div></div>
    <p class="bitnote">En-tête TCP, ${off * 4} octets. Drapeaux : C E U A P R S F = ${FL.join(' ')}.</p>`;
}
function renderEvent(c) {
  const e = c.ev[st.ev]; if (!e) return '';
  const beg = B();
  let s = `<section class="sec"><h3 class="h"><span>${beg ? 'Ce message' : 'Paquet sélectionné'}</span><span class="n">${fmtT(e.t)}</span></h3>`;
  if (e.k === 'gap') return s + `<p class="prose">${esc(beg ? e.b : e.e)}.</p></section>`;
  s += `<p class="prose">${esc(beg ? e.eb || e.b : e.ee || e.e)}</p>`;
  if (beg) {
    const facts = [];
    if (e.hdr) {
      facts.push(`<span><em>De</em> port ${e.hdr.sp}${PORTN[e.hdr.sp] ? ' (' + PORTN[e.hdr.sp] + ')' : ''}</span>`);
      facts.push(`<span><em>Vers</em> port ${e.hdr.dp}${PORTN[e.hdr.dp] ? ' (' + PORTN[e.hdr.dp] + ')' : ''}</span>`);
      facts.push(`<span><em>Terme technique</em> ${esc(e.hdr.f.join(', '))}</span>`);
    } else facts.push(`<span><em>Terme technique</em> ${esc(e.e)}</span>`);
    s += `<div class="facts">${facts.join('')}</div>`;
  }
  if (e.L) s += `<div class="layers" aria-label="Couches du paquet">${e.L.map((l, i) => `<span class="${i === e.L.length - 1 ? 'top' : ''}"><b>${esc(beg ? l[2] : l[0])}</b><i>${beg ? esc(l[0]) : fmtInt(l[1]) + ' o'}</i></span>`).join('')}</div>`;
  if (!beg && e.hdr) s += bitGrid(e.hdr);
  if (e.fields) s += `<dl class="kv">${e.fields.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  return s + `</section>`;
}
function renderInsp() {
  const c = CMAP[st.sel], beg = B(), pr = PROTO[c.p];
  const pill = c.sev === 'crit' ? `<span class="pill crit">${glyph('crit', 10)}Problème</span>` : c.sev === 'warn' ? `<span class="pill warn">${glyph('warn', 10)}À surveiller</span>` : `<span class="pill ok">${glyph('ok', 10)}Normal</span>`;
  const todo = beg ? c.dB : c.dE;
  $('#insp').innerHTML = `
    <div class="ih">
      <div class="eyebrow">${pill}<span class="proto">${wire(c.p)}${esc(beg ? pr.b : pr.name + (c.port ? ' · :' + c.port : ''))}</span></div>
      <h2>${esc(beg ? c.tB : c.tE)}</h2>
      <div class="ends">${esc(HOSTS[c.a].label)} (${esc(HOSTS[c.a].ip)}) ⇄ ${esc(HOSTS[c.b].label)} (${esc(HOSTS[c.b].ip)})</div>
    </div>
    <dl class="stats">
      <div><dt>Paquets</dt><dd>${fmtInt(c.packets)}</dd></div>
      <div><dt>Volume</dt><dd>${fmtBytes(c.bytes)}</dd></div>
      <div><dt>Durée</dt><dd>${fmtDur(c.end - c.start)}</dd></div>
      <div><dt>${beg ? 'Réactivité' : 'RTT'}</dt><dd>${c.rtt}</dd></div>
    </dl>
    <section class="sec">
      <h3 class="h"><span>${beg ? 'Ce qui se passe' : 'Analyse'}</span></h3>
      <p class="prose">${esc(beg ? c.sB : c.sE)}</p>
      ${todo ? `<p class="subh">${beg ? 'Que faire' : 'Indices'}</p><ul class="todo">${todo.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    </section>
    <section class="sec">
      <h3 class="h"><span>${beg ? 'L’échange, message par message' : 'Diagramme de séquence'}</span><span class="n">${c.ev.length} étapes</span></h3>
      <div class="seqwrap">${renderSeq(c)}</div>
    </section>
    ${renderEvent(c)}`;
}

/* ---------- orchestration ---------- */
function select(id, ev) {
  const c = CMAP[id];
  st.sel = id;
  st.ev = ev != null ? ev : (c.fEv != null ? c.fEv : 0);
  renderFinds(); renderList(); paintGraph(); renderInsp();
}
function renderAll() {
  document.querySelectorAll('.mode button').forEach(b => b.setAttribute('aria-pressed', String((b.id === 'm-b') === B())));
  renderMeta(); renderFinds(); renderList(); renderLegend(); renderGraph(); renderTrace(); paintHead(); renderInsp();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-c],[data-i],[data-n],[data-chip]');
  if (!t) return;
  if (t.dataset.chip) {
    st.chip = t.dataset.chip;
    document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    renderList(); paintGraph(); return;
  }
  if (t.dataset.n) {
    const h = HOSTS[t.dataset.n];
    st.q = t.dataset.n === 'poste' ? '' : h.ip.indexOf('port') === 0 ? h.label : h.ip;
    $('#q').value = st.q; renderList(); paintGraph();
    const first = ORDER.map(i => CMAP[i]).find(isMatch); if (first && t.dataset.n !== 'poste') select(first.id);
    return;
  }
  if (t.dataset.i != null && t.closest('#insp')) { st.ev = +t.dataset.i; renderInsp(); const el = document.querySelector(`.ev[data-i="${st.ev}"]`); el && el.focus({preventScroll:true}); return; }
  if (t.dataset.c) {
    const evI = t.dataset.ev != null ? +t.dataset.ev : undefined;
    if (t.classList.contains('mk')) { st.timeMode = true; st.t = CMAP[t.dataset.c].ev[evI].t; paintHead(); }
    select(t.dataset.c, evI);
    if (window.matchMedia('(max-width:1180px)').matches && !t.closest('#graph')) $('#insp').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block:'start'});
  }
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('.ev,.node')) { ev.preventDefault(); t.dispatchEvent(new MouseEvent('click', {bubbles:true})); return; }
  if (t.matches && t.matches('input')) return;
  const c = CMAP[st.sel];
  if (ev.key === 'ArrowDown' || ev.key === 'j') { st.ev = Math.min(c.ev.length - 1, st.ev + 1); renderInsp(); ev.preventDefault(); }
  if (ev.key === 'ArrowUp' || ev.key === 'k') { st.ev = Math.max(0, st.ev - 1); renderInsp(); ev.preventDefault(); }
  if (ev.key === ' ' && !t.matches('button')) { ev.preventDefault(); togglePlay(); }
});
$('#q').addEventListener('input', e => { st.q = e.target.value; renderList(); paintGraph(); });
['m-b','m-e'].forEach(id => $('#' + id).addEventListener('click', () => {
  st.mode = id === 'm-b' ? 'b' : 'e';
  try { localStorage.setItem('trame-mode', st.mode); } catch (e) {}
  renderAll();
}));

/* playback + scrubbing */
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
let last = 0, dots = [];
function togglePlay() {
  st.playing = !st.playing;
  if (st.playing) { st.timeMode = true; if (st.t >= DUR - 0.05) st.t = 0; last = performance.now(); requestAnimationFrame(tick); }
  $('#play-ic').innerHTML = st.playing ? '<path d="M1 0.5h3v11H1zM6 0.5h3v11H6z"/>' : '<path d="M1 0.5 9.5 6 1 11.5z"/>';
  $('#play').setAttribute('aria-label', st.playing ? 'Mettre en pause' : 'Rejouer la capture');
}
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (st.playing) {
    st.t += dt;
    if (st.t >= DUR) { st.t = DUR; togglePlay(); }
    if (!reduce) spawn(dt, now);
  }
  paintHead(); paintGraph(); drawDots(now);
  if (st.playing || dots.length) requestAnimationFrame(tick);
}
function spawn(dt, now) {
  const bi = Math.min(NB - 1, Math.floor(st.t * 10));
  CONVS.forEach(c => {
    const v = c.bins[bi]; if (v < 0.05 || !isMatch(c)) return;
    const rate = Math.min(14, 1.5 + Math.log2(1 + v) * 2.2);
    if (Math.random() < rate * dt) {
      const evs = c.ev.filter(e => e.k !== 'gap');
      const dir = c.id === 'c2' || c.id === 'c5' ? (Math.random() < 0.82 ? 'ba' : 'ab') : evs[Math.floor(Math.random() * evs.length)].d;
      dots.push({c:c.id, born:now, dur:BUNDLE.includes(c.id) ? 900 : 650, dir, lost: c.id === 'c2' && st.t > 4.88 && st.t < 7.1 && dir === 'ba' && Math.random() < 0.35});
    }
  });
  if (dots.length > 70) dots = dots.slice(-70);
}
function drawDots(now) {
  const g = document.getElementById('dots'); if (!g) return;
  dots = dots.filter(d => now - d.born < d.dur);
  let s = '';
  dots.forEach(d => {
    const p = document.querySelector(`[data-e="${d.c}"]`), L = p.getTotalLength();
    let k = (now - d.born) / d.dur; if (d.lost && k > 0.5) return;
    const a = HOSTS[CMAP[d.c].a];
    // path always starts at the local side (poste) except for mDNS which starts at the printer side
    let from0 = d.dir === 'ab'; if (CMAP[d.c].a !== 'poste') from0 = !from0;
    const pt = p.getPointAtLength(L * (from0 ? k : 1 - k));
    s += `<circle class="dot" cx="${pt.x}" cy="${pt.y}" r="${d.lost ? 3.2 : 2.6}" style="fill:${d.lost ? 'var(--crit)' : 'var(--ink)'}"/>`;
  });
  g.innerHTML = s;
}
$('#play').addEventListener('click', togglePlay);
$('#reset').addEventListener('click', () => { if (st.playing) togglePlay(); st.timeMode = false; dots = []; drawDots(performance.now()); paintHead(); paintGraph(); });
const plot = $('#plot');
const seek = e => { const r = plot.getBoundingClientRect(); st.t = Math.max(0, Math.min(DUR, (e.clientX - r.left) / r.width * DUR)); st.timeMode = true; paintHead(); paintGraph(); };
plot.addEventListener('pointerdown', e => { if (e.target.closest('.mk')) return; plot.setPointerCapture(e.pointerId); seek(e); });
plot.addEventListener('pointermove', e => { if (plot.hasPointerCapture(e.pointerId)) seek(e); });

renderAll();
})();
</script>
