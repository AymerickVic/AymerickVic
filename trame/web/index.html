<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trame</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
/* Layout: beginner = a readable report beside a who-talks-to-whom map;
   expert = filter bar, packet list, field tree and hex dump, with findings on the side.
   Protocol colours follow the T568B cable pairs (blue, green, brown, orange). */
:root{
  --bg:#E6E9ED; --panel:#F6F7F9; --sunk:#DCE1E7; --hover:#ECEFF2; --sel:#C9D6E6;
  --ink:#111920; --ink2:#43505C; --ink3:#6E7985; --rule:#C8CFD7; --zone:#EEF1F4;
  --g-secure:#1E5DA6; --g-dns:#2A7746; --g-file:#7A4C2B; --g-web:#CC5B0B; --g-tcp:#B9773E;
  --g-udp:#5C6B7A; --g-local:#89929C; --g-icmp:#89929C; --g-other:#A3ABB4;
  --crit:#B42318; --crit-bg:#F7E1DD; --warn:#94590A; --warn-bg:#F3E7D2; --hl:#FFE7A3;
  --m-ink:var(--ink); --m-crit:var(--crit); --m-warn:var(--warn); --m-mut:var(--ink3);
  --f-ui:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --panel:#151B20; --sunk:#202931; --hover:#1A2128; --sel:#243447;
  --ink:#E4E8EB; --ink2:#AAB4BD; --ink3:#7A8691; --rule:#2A343D; --zone:#121820;
  --g-secure:#6EA2E4; --g-dns:#5FBC83; --g-file:#C38E66; --g-web:#EF8A3F; --g-tcp:#D7A06E;
  --g-udp:#8D9CAB; --g-local:#8C97A2; --g-icmp:#8C97A2; --g-other:#6B7782;
  --crit:#F0766B; --crit-bg:#3A1C1A; --warn:#E0A94A; --warn-bg:#33281A; --hl:#5A4A16;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1317; --panel:#151B20; --sunk:#202931; --hover:#1A2128; --sel:#243447;
  --ink:#E4E8EB; --ink2:#AAB4BD; --ink3:#7A8691; --rule:#2A343D; --zone:#121820;
  --g-secure:#6EA2E4; --g-dns:#5FBC83; --g-file:#C38E66; --g-web:#EF8A3F; --g-tcp:#D7A06E;
  --g-udp:#8D9CAB; --g-local:#8C97A2; --g-icmp:#8C97A2; --g-other:#6B7782;
  --crit:#F0766B; --crit-bg:#3A1C1A; --warn:#E0A94A; --warn-bg:#33281A; --hl:#5A4A16;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:21px;font-weight:700;font-stretch:78%;letter-spacing:-.01em}
.file{display:flex;flex-direction:column;gap:1px;min-width:0}
.file .name{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch}
.file .meta{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;font-stretch:85%;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);border:1px solid var(--rule);padding:1px 6px;border-radius:2px;white-space:nowrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;border:1px solid var(--rule);border-radius:3px;padding:6px 12px;background:var(--panel);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.mode{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden;flex:none}
.mode button{padding:5px 12px;font-size:13px;font-weight:500}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.drop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);border:3px dashed var(--ink);font-size:20px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:3px;font-size:13.5px;max-width:min(560px,calc(100% - 32px))}

/* ---------- shared bits ---------- */
.h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:11px;font-weight:600;font-stretch:85%;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3)}
.h .n{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:400}
.wire{display:inline-block;flex:none;width:18px;height:6px;border-radius:3px;background:var(--c)}
.glyph{display:inline-block;vertical-align:-1px;flex:none}
.prose{margin:0;font-size:15px;line-height:1.55;max-width:62ch}
.todo{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.todo li{display:grid;grid-template-columns:18px minmax(0,1fr);font-size:14px;color:var(--ink2)}
.todo li::before{content:"→";color:var(--ink3);font-family:var(--f-mono)}
.subh{font-size:12.5px;font-weight:600;margin:16px 0 0}
.empty{font-size:13.5px;color:var(--ink3);padding:8px 0}

/* ---------- beginner report ---------- */
.story{overflow:auto;min-height:0}
.story-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:48px;max-width:1220px;margin:0 auto;
  padding-block:36px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.kicker{font-size:12px;font-weight:600;font-stretch:85%;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin:0 0 10px}
.story h1{font-size:clamp(26px,3.2vw,36px);line-height:1.15;font-weight:650;font-stretch:86%;letter-spacing:-.012em;margin:0 0 12px;text-wrap:balance;max-width:24ch}
.lede{font-size:16px;line-height:1.55;color:var(--ink2);margin:0 0 32px;max-width:58ch}
.group{margin:0 0 32px}
.items{list-style:none;margin:0;padding:0}
.item{border-bottom:1px solid var(--rule)}
.item-h{display:grid;grid-template-columns:20px minmax(0,1fr) 16px;gap:2px 10px;width:100%;text-align:left;padding:14px 0;align-items:start}
.item-h .g{padding-top:4px}
.item-h b{font-size:16.5px;font-weight:600;display:block}
.item-h .one{display:block;font-size:14.5px;color:var(--ink2);margin-top:2px}
.item-h .chev{margin-top:6px;width:12px;height:12px;transition:transform .2s}
.item[data-open="true"] .chev{transform:rotate(90deg)}
.item-h:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.item.ok .item-h{padding:10px 0}
.item.ok .item-h b{font-size:15px;font-weight:500}
.item.ok .item-h .one{font-size:13.5px}
.item-b{padding:0 0 20px 30px}
.more{margin-top:16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:3px;padding:6px 12px;background:var(--panel)}
.more:hover{border-color:var(--ink)}
.seqwrap{margin-top:16px;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:8px 8px 4px;overflow-x:auto}
svg.seq{display:block;width:100%;max-width:520px;min-width:320px}
.msg{margin-top:12px;padding:12px 14px;border-left:2px solid var(--ink);background:var(--panel)}
.msg p{margin:0;font-size:14px}
.msg small{display:block;font-size:11px;color:var(--ink3);font-family:var(--f-mono);margin-bottom:4px;overflow-wrap:anywhere}
.story-side{position:sticky;top:24px;align-self:start}
.cap{font-size:13px;color:var(--ink3);margin:10px 2px 0}
.mapbox{background:var(--panel);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px 12px;font-size:12px;color:var(--ink2);border-top:1px solid var(--rule)}
.legend span{display:flex;align-items:center;gap:6px}
.zone{fill:var(--zone);stroke:var(--rule)}
.zlabel{font:600 13px var(--f-ui);font-stretch:85%;letter-spacing:.09em;fill:var(--ink3)}
.edge{fill:none;stroke-linecap:round;transition:opacity .2s}
.edge.dim{opacity:.3}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.node circle,.node rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}
.node.me circle.core{fill:var(--ink)}
.node{cursor:pointer}
.nl{font:600 15px var(--f-ui);fill:var(--ink)}
.ns{font:400 11.5px var(--f-mono);fill:var(--ink3)}
.sevm{pointer-events:none}
.lane-h{font:600 12px var(--f-ui);fill:var(--ink)}
.lane-s{font:400 10.5px var(--f-mono);fill:var(--ink3)}
.lane{stroke:var(--rule)}
.ev{cursor:pointer;outline:none}
.ev .bg{fill:transparent}
.ev:hover .bg{fill:var(--hover)}
.ev.on .bg{fill:var(--sunk)}
.ev .dt{font:400 10.5px var(--f-mono);fill:var(--ink3)}
.ev .lb{font:500 12px var(--f-ui);fill:var(--ink)}
.ev .lb.m{font:400 11px var(--f-mono)}
.ev .tt{font:400 10px var(--f-mono);fill:var(--ink3)}
.ev .gap{font:400 11.5px var(--f-ui);fill:var(--ink3)}

/* ---------- expert workbench ---------- */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto minmax(0,1fr);min-height:0}
.fbar{grid-column:1 / -1;display:flex;gap:8px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.fin{flex:1 1 360px;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:3px;background:var(--bg);min-width:0}
.fin.ok{border-color:var(--g-dns);box-shadow:inset 3px 0 0 var(--g-dns)}
.fin.bad{border-color:var(--crit);box-shadow:inset 3px 0 0 var(--crit)}
.fin input{flex:1;border:0;background:none;outline:none;font:13px var(--f-mono);color:var(--ink);min-width:0}
.fin input::placeholder{color:var(--ink3);font-family:var(--f-ui)}
.ferr{font-size:12px;color:var(--crit);flex-basis:100%}
.fcount{font:12px var(--f-mono);color:var(--ink2);white-space:nowrap}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 9px;border:1px solid var(--rule);border-radius:2px;color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.strip{grid-column:1;padding:8px 16px 6px;border-bottom:1px solid var(--rule);background:var(--panel)}
.plot{position:relative;height:46px;cursor:crosshair}
.plot svg{position:absolute;inset:0;width:100%;height:100%}
.mk{position:absolute;top:-3px;transform:translateX(-50%);width:16px;height:14px;display:flex;align-items:center;justify-content:center}
.workarea{grid-column:1;grid-row:3;display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);min-height:0;min-width:0}
.plist{position:relative;overflow:auto;min-height:0;background:var(--panel);border-bottom:1px solid var(--rule)}
.thead,.prow{display:grid;grid-template-columns:62px 92px minmax(110px,1fr) minmax(110px,1fr) 78px 58px minmax(240px,3fr);font-variant-numeric:tabular-nums}
.thead{position:sticky;top:0;z-index:2;background:var(--sunk);font-size:11px;font-weight:600;font-stretch:88%;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);border-bottom:1px solid var(--rule);min-width:760px}
.thead div{padding:6px 8px}
.rows{position:relative;min-width:760px}
.prow{position:absolute;left:0;right:0;height:24px;font:12px var(--f-mono);cursor:default;border-left:3px solid var(--c)}
.prow div{padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow:hover{background:var(--hover)}
.prow.warn{color:var(--warn)}
.prow.error{color:var(--crit)}
.prow.on{background:var(--sel);color:var(--ink)}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.tree{overflow:auto;background:var(--panel);border-right:1px solid var(--rule);padding:6px 0;font-size:12.5px;min-height:0}
.tree ul{list-style:none;margin:0;padding:0}
.tree li ul{padding-left:16px}
.tn{display:flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;cursor:default;min-height:22px}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--sel)}
.tn .tg{width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.tn .tl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn.proto>.tl{font-weight:600}
.tn.warn .tl{color:var(--warn)}
.tn.error .tl{color:var(--crit)}
.tn .fa{display:none;gap:4px;flex:none}
.tn:hover .fa,.tn.on .fa{display:flex}
.fa button{font-size:11px;border:1px solid var(--rule);border-radius:2px;padding:0 6px;background:var(--panel);color:var(--ink2)}
.fa button:hover{border-color:var(--ink);color:var(--ink)}
.tname{font:10.5px var(--f-mono);color:var(--ink3);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hex{overflow:auto;background:var(--panel);padding:8px 12px;font:12px/1.65 var(--f-mono);min-height:0;white-space:nowrap}
.hex .off{color:var(--ink3);margin-right:12px}
.hex .b{padding:0 1px;cursor:pointer}
.hex .b.on{background:var(--hl)}
.hex .asc{margin-left:14px;color:var(--ink2)}
.hex .asc .on{background:var(--hl)}
.side{grid-column:2;grid-row:2 / 4;background:var(--panel);border-left:1px solid var(--rule);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pane{overflow:auto;padding:12px 14px;min-height:0}
.find{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 8px;width:100%;text-align:left;padding:8px;margin:0 -8px 2px;border-radius:3px;width:calc(100% + 16px)}
.find:hover{background:var(--hover)}
.find .g{grid-row:span 2;padding-top:3px}
.find .t{font-weight:600;font-size:13px}
.find .s{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.ctab{width:100%;border-collapse:collapse;font-size:12px}
.ctab td{padding:5px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
.ctab tr{cursor:pointer}
.ctab tr:hover td{background:var(--hover)}
.ctab .num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.ctab .ep{font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--c)}

@media (max-width:1100px){
  .bench{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(420px,1fr) auto}
  .side{grid-column:1;grid-row:4;border-left:0;border-top:1px solid var(--rule);max-height:none}
  .app{height:auto;min-height:100%}
  .workarea{min-height:640px}
}
@media (max-width:900px){
  .story-in{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .story-side{position:static;order:-1}
  .story-main{display:contents}
  .story-head{order:-2}
  .lower{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(220px,1fr) minmax(160px,auto)}
  .tree{border-right:0;border-bottom:1px solid var(--rule)}
  .file .name{max-width:20ch}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true">
        <rect x="0" y="3" width="7" height="8" style="fill:var(--ink3)"/><rect x="8" y="3" width="5" height="8" style="fill:var(--ink)"/>
        <rect x="14" y="3" width="5" height="8" style="fill:var(--ink)"/><rect x="20" y="3" width="2" height="8" style="fill:var(--ink2)"/>
        <rect x="23" y="1" width="8" height="12" style="fill:none;stroke:var(--ink);stroke-width:1.3"/><rect x="32" y="3" width="2" height="8" style="fill:var(--ink3)"/>
      </svg>
      <b>trame</b>
    </div>
    <div class="file"><span class="name" id="fname">Chargement…</span><span class="meta" id="fmeta"></span></div>
    <span class="tag" id="sample-tag" hidden>Capture d'exemple</span>
    <div class="spacer"></div>
    <label class="btn" for="file-in">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 9v3h10V9M7 2v7M4 5l3-3 3 3" style="fill:none;stroke:var(--ink);stroke-width:1.5"/></svg>
      Ouvrir une capture
    </label>
    <input id="file-in" type="file" accept=".pcap,.pcapng,.cap,.dmp" hidden>
    <div class="mode" role="group" aria-label="Niveau de lecture">
      <button id="m-b" aria-pressed="true">Débutant</button>
      <button id="m-e" aria-pressed="false">Expert</button>
    </div>
  </header>

  <main class="story" id="story">
    <div class="story-in">
      <div class="story-main">
        <div class="story-head" id="story-head"></div>
        <div id="story-list"></div>
      </div>
      <aside class="story-side">
        <div class="mapbox"><svg id="map" viewBox="0 0 800 460" aria-label="Carte des échanges"></svg><div class="legend" id="legend"></div></div>
        <p class="cap">Qui parle à qui. Clique sur un lien pour voir l’échange correspondant.</p>
      </aside>
    </div>
  </main>

  <main class="bench" id="bench" hidden>
    <div class="fbar">
      <label class="fin" id="fin" for="flt">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 2h12L8.5 7.5V12l-3-1.5v-3z" style="fill:none;stroke:var(--ink3);stroke-width:1.4"/></svg>
        <input id="flt" type="text" spellcheck="false" autocomplete="off" placeholder="Filtre d’affichage, syntaxe Wireshark : tcp.port == 443 && !dns">
      </label>
      <button class="btn" id="flt-go">Appliquer</button>
      <span class="fcount" id="fcount"></span>
      <div class="qchips" id="qchips"></div>
      <div class="ferr" id="ferr" hidden></div>
    </div>
    <div class="strip"><div class="plot" id="plot"><svg id="bars" viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true"></svg><div id="marks"></div></div></div>
    <div class="workarea">
      <div class="plist" id="plist" tabindex="0" aria-label="Liste des paquets">
        <div class="thead"><div>N°</div><div>Temps</div><div>Source</div><div>Destination</div><div>Protocole</div><div>Long.</div><div>Info</div></div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="lower">
        <div class="tree" id="tree" aria-label="Détail du paquet"></div>
        <div class="hex" id="hex" aria-label="Octets du paquet"></div>
      </div>
    </div>
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="finds" aria-selected="true">Constats</button>
        <button role="tab" data-tab="convs" aria-selected="false">Conversations</button>
        <button role="tab" data-tab="hosts" aria-selected="false">Appareils</button>
        <button role="tab" data-tab="protos" aria-selected="false">Protocoles</button>
      </div>
      <div class="pane" id="pane"></div>
